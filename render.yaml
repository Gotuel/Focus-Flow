services:
  - type: web
    name: focus-flow-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health

  - type: web
    name: focus-flow-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: focus-flow-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
